name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_test.txt
          pip install -e .

      - name: Run Unit Tests
        run: pytest tests/test_unit/ -vv -p no:warnings

      - name: Run Functional Tests
        run: behave tests/test_functional/features

  quality:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_test.txt
          pip install -e .

      - name: Run Flake8
        run: flake8 formation_indus_ds_avancee/ tests/

      - name: Run Pylint
        run: pylint formation_indus_ds_avancee/ --exit-zero --score=y

      - name: Run Bandit
        run: bandit -r formation_indus_ds_avancee/ -f txt

      - name: Run Vulture
        run: vulture formation_indus_ds_avancee/ --min-confidence 80

      - name: Check Code Complexity
        run: |
          radon cc formation_indus_ds_avancee/ -a -nb
          radon mi formation_indus_ds_avancee/ -nb

      - name: Unit Test Coverage
        run: |
          pytest tests/test_unit/ \
            --cov=formation_indus_ds_avancee \
            --cov-report=term \
            --cov-fail-under=80
